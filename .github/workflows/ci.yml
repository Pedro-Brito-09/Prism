name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyed on the pinned version, so a bump refetches and everything else
      # reuses the download.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tooling
          key: tooling-luau-lsp-1.69.0

      - name: Type check
        run: scripts/analyze.sh

      - name: Channel arity
        run: node scripts/check-channels.js
