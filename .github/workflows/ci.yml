name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    name: Type check
    # Pinned: ubuntu-latest moves to a new image on its own schedule, and the
    # toolchain is a prebuilt luau-lsp binary that has only ever run on this one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Keyed on the pinned version, so a bump refetches and everything else
      # reuses the download.
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: .tooling
          key: tooling-luau-lsp-1.69.0-luau-0.738

      - name: Type check
        run: bash scripts/analyze.sh

      - name: Channel arity
        run: node scripts/check-channels.js

      - name: Tests that do not need Roblox
        run: bash scripts/test-pure.sh

      # dist/ is not committed: a release builds its own models from the tag.
      # Built here as well so a push that breaks the build fails, and kept as
      # an artifact so any push can be tried in Studio without tagging it.
      - name: Build models
        run: node scripts/build.js

      - name: Upload models
        uses: actions/upload-artifact@v7
        with:
          name: Prism-${{ github.sha }}
          path: dist/*.rbxmx
