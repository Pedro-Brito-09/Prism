name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    name: Type check
    # Pinned: ubuntu-latest moves to a new image on its own schedule, and the
    # toolchain is a prebuilt luau-lsp binary that has only ever run on this one.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Keyed on the pinned version, so a bump refetches and everything else
      # reuses the download.
      - name: Cache toolchain
        uses: actions/cache@v6
        with:
          path: .tooling
          key: tooling-luau-lsp-1.69.0-luau-0.738

      - name: Type check
        run: bash scripts/analyze.sh

      - name: Channel arity
        run: node scripts/check-channels.js

      - name: Tests that do not need Roblox
        run: bash scripts/test-pure.sh

      # dist/ is not committed: a release builds its own models from the tag.
      # Built here as well so a push that breaks the build fails, and kept as
      # an artifact so any push can be tried in Studio without tagging it.
      - name: Build models
        run: node scripts/build.js

      - name: Upload models
        uses: actions/upload-artifact@v7
        with:
          name: Prism-${{ github.sha }}
          path: dist/*.rbxmx

  studio:
    name: Server suite on Roblox
    # After the checks, so a push that does not type check or build does not
    # spend a publish and an execution finding out.
    needs: analyze
    # Once per push: a pull request from this repository is already a push,
    # and running both would publish twice. A fork has neither the key nor the
    # place, so it is skipped rather than failed.
    if: github.event_name == 'push' && vars.ROBLOX_PLACE_ID != ''
    runs-on: ubuntu-24.04
    # One run at a time against the one test place: two at once would share
    # its data stores, and the database section wipes its keys.
    concurrency:
      group: studio-test-place
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Build the test place
        run: node scripts/build.js

      - name: Run the server suite
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ vars.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ vars.ROBLOX_PLACE_ID }}
        run: node scripts/studio-tests.js
