name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  analyze:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Keyed on the pinned version, so a bump refetches and everything else
      # reuses the download.
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: .tooling
          key: tooling-luau-lsp-1.69.0-luau-0.738

      - name: Type check
        run: bash scripts/analyze.sh

      - name: Channel arity
        run: node scripts/check-channels.js

      - name: Tests that do not need Roblox
        run: bash scripts/test-pure.sh

      # The models in dist/ are what a place inserts, so a push that changes the
      # source without rebuilding them would ship the old code.
      - name: Models are current
        run: |
          node scripts/build.js
          git diff --exit-code -- dist || { echo "dist/ is stale: run node scripts/build.js and commit it."; exit 1; }
